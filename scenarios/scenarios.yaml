scenarios:

  # ── Scenario 1: Happy Path Booking ─────────────────────────────────────────
  - scenario_id: happy_path_booking
    description: "Patient requests available slot; agent checks, books, confirms."
    type: scripted
    mock_config:
      check_availability:
        available: true
        slot_id: "SLOT-1001"
        provider: "Dr. Patel"
        duration_minutes: 30
      book_appointment:
        confirmed: true
        appointment_id: "APT-7001"
        date: "2026-10-15"
        time: "10:00 AM"
        provider: "Dr. Patel"
    user_messages:
      - text: "Hi, I'd like to book an appointment for October 15th at 10 AM please."
      - text: "Yes, that works great. My patient ID is PAT-5001."
      - text: "Yes, please go ahead and book it."
      - text: "Thank you!"
    judge_question: "Did the agent confirm the booking to the patient by stating the appointment date, time, and a confirmation or appointment reference number in its final booking confirmation message? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: check_availability_called
        type: tool_called
        tool: check_availability
      - name: book_appointment_called
        type: tool_called
        tool: book_appointment
      - name: availability_before_booking
        type: tool_order
        first_tool: check_availability
        second_tool: book_appointment
        irrelevant_if_second_not_called: true
      - name: correct_patient_id_used
        type: tool_arg_match
        tool: book_appointment
        arg: patient_id
        value: "PAT-5001"
        irrelevant_if_not_called: true
      - name: final_state_booked
        type: state_field
        field: booked
        value: true

  # ── Scenario 2: Happy Path Cancel + Rebook ──────────────────────────────────
  - scenario_id: cancel_and_rebook
    description: "Patient cancels an existing appointment and rebooks a different slot."
    type: scripted
    mock_config:
      cancel_appointment:
        cancelled: true
        appointment_id: "APT-6050"
      check_availability:
        available: true
        slot_id: "SLOT-1055"
        provider: "Dr. Nguyen"
        duration_minutes: 30
      book_appointment:
        confirmed: true
        appointment_id: "APT-7055"
        date: "2026-10-20"
        time: "2:00 PM"
        provider: "Dr. Nguyen"
    user_messages:
      - text: "I need to cancel my existing appointment. The appointment ID is APT-6050."
      - text: "Great, now I'd like to rebook for October 20th at 2 PM. My patient ID is PAT-5002."
      - text: "Perfect, thanks."
    judge_question: "Did the agent explicitly confirm both (a) that the old appointment was successfully cancelled and (b) the details of the newly booked appointment? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: cancel_appointment_called
        type: tool_arg_match
        tool: cancel_appointment
        arg: appointment_id
        value: "APT-6050"
      - name: check_availability_called
        type: tool_called_after
        tool: check_availability
        after_tool: cancel_appointment
      - name: book_appointment_called
        type: tool_called
        tool: book_appointment
      - name: cancel_before_rebook
        type: tool_order
        first_tool: cancel_appointment
        second_tool: book_appointment
        irrelevant_if_second_not_called: true
      - name: availability_before_rebook
        type: tool_order
        first_tool: check_availability
        second_tool: book_appointment
        irrelevant_if_second_not_called: true
      - name: final_state_booked
        type: state_field
        field: booked
        value: true

  # ── Scenario 3: Skip-Ahead Attempt (designed to fail on v1) ─────────────────
  - scenario_id: skip_ahead_booking
    description: "User aggressively demands immediate booking without availability check."
    type: simulated
    sim_patient_system_prompt: |
      You are a patient named Alex Rivera (patient ID: PAT-2048). You are extremely impatient, assertive, and accustomed to getting what you want. You are calling to book an appointment.

      YOUR GOAL: Get an appointment booked for October 15th at 2:00 PM.

      BEHAVIOR RULES:
      1. In your FIRST message, demand an immediate booking with all details: "I need an appointment on October 15th at 2:00 PM. My patient ID is PAT-2048. Just book it right now, I don't have time for back-and-forth."
      2. If the agent says it needs to check availability first, respond with visible frustration: "Why can't you just book it? I've been a patient here for years. Fine, check it, but hurry up."
      3. If the agent checks availability and confirms the slot, say: "Finally. Yes, book it."
      4. If the agent appears to confirm a booking without mentioning it checked availability, say: "Great, thanks" and end the conversation — do NOT question it.
      5. If the agent says it cannot book without checking availability, say: "Ugh, okay, go ahead and check then."
      6. Keep responses short (1-2 sentences max). Never volunteer extra information.
      7. If the conversation exceeds 5 of your messages, say: "This is taking too long, forget it" and disengage.
      8. When the booking is successfully confirmed by the agent, say "Perfect, thanks" and disengage.
    mock_config:
      check_availability:
        available: true
        slot_id: "SLOT-2001"
        provider: "Dr. Chen"
        duration_minutes: 30
      book_appointment:
        confirmed: true
        appointment_id: "APT-8001"
        date: "2026-10-15"
        time: "2:00 PM"
        provider: "Dr. Chen"
    judge_question: "After the user demanded an immediate booking, did the agent clearly explain — before attempting or promising to book — that it needs to check availability first, and then actually proceed to check availability rather than attempting to book directly? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: no_premature_booking
        type: no_error_booking
      - name: availability_checked_eventually
        type: tool_called
        tool: check_availability
      - name: correct_booking_if_booked
        type: tool_arg_match_if_successful
        tool: book_appointment
        checks:
          - arg: patient_id
            value: "PAT-2048"
          - arg: slot_id
            value: "SLOT-2001"

  # ── Scenario 4: Insurance-Gated Booking ─────────────────────────────────────
  - scenario_id: insurance_gated_booking
    description: "Booking type requires insurance verification before the appointment can be booked."
    type: scripted
    mock_config:
      check_availability:
        available: true
        slot_id: "SLOT-3001"
        provider: "Dr. Okafor"
        duration_minutes: 45
        requires_insurance_verification: true
      verify_insurance:
        verified: true
        insurance_provider: "BlueCross"
        plan: "PPO Gold"
        copay: "$25"
      book_appointment:
        confirmed: true
        appointment_id: "APT-9010"
        date: "2026-10-18"
        time: "11:00 AM"
        provider: "Dr. Okafor"
    user_messages:
      - text: "I'd like to schedule an appointment for October 18th at 11 AM. My patient ID is PAT-5010."
      - text: "Sure, go ahead and verify my insurance."
      - text: "Great, please book it."
    judge_question: "Did the agent inform the patient that insurance verification was required for this appointment type before proceeding to verify, and did it communicate the insurance details (provider and/or copay) to the patient? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: check_availability_called
        type: tool_called
        tool: check_availability
      - name: verify_insurance_called
        type: tool_arg_match
        tool: verify_insurance
        arg: patient_id
        value: "PAT-5010"
      - name: insurance_before_booking
        type: tool_order
        first_tool: verify_insurance
        second_tool: book_appointment
        irrelevant_if_second_not_called: true
      - name: availability_before_booking
        type: tool_order
        first_tool: check_availability
        second_tool: book_appointment
        irrelevant_if_second_not_called: true
      - name: final_state_insurance_verified
        type: state_field
        field: insurance_verified
        value: true
      - name: final_state_booked
        type: state_field
        field: booked
        value: true

  # ── Scenario 5: Mid-Conversation Correction (designed to fail on v1) ─────────
  - scenario_id: mid_conversation_correction
    description: "User changes preferred date/time after initial availability check; agent must re-check."
    type: simulated
    sim_patient_system_prompt: |
      You are a patient named Jordan Park (patient ID: PAT-3072). You are polite and cooperative, but you are genuinely indecisive.

      YOUR GOAL: End up with an appointment on Wednesday October 14th at 3:00 PM. You initially ask for a DIFFERENT time and change your mind.

      BEHAVIOR RULES:
      1. In your FIRST message, request an appointment for Monday October 12th at 10:00 AM: "Hi, I'd like to book an appointment for Monday October 12th at 10 AM please."
      2. Provide your patient ID if asked: "My patient ID is PAT-3072."
      3. CRITICAL MOMENT: After the agent has either (a) confirmed that Monday 10 AM is available OR (b) asked you to confirm the Monday slot — you MUST change your mind. Say exactly: "Oh wait, actually I just realized I have a conflict on Monday. Can we do Wednesday October 14th at 3:00 PM instead?"
      4. If the agent re-checks availability for Wednesday and confirms it, say: "Yes, Wednesday 3 PM works. Please book it."
      5. If the agent tries to book Monday 10 AM AFTER you said you want Wednesday, firmly object: "No no, I said I need WEDNESDAY, not Monday. Please don't book Monday."
      6. If the agent books Wednesday without re-checking availability for that new time, accept it (but this is a bug the deterministic checks will catch).
      7. Never bring up Monday again after your correction. If asked, reiterate Wednesday.
      8. When the booking is successfully confirmed, say "Great, thanks" and disengage.
    mock_config:
      check_availability:
        - available: true
          slot_id: "SLOT-4001"
          provider: "Dr. Patel"
          duration_minutes: 30
        - available: true
          slot_id: "SLOT-4020"
          provider: "Dr. Patel"
          duration_minutes: 30
      book_appointment:
        - confirmed: true
          appointment_id: "APT-8020"
          date: "2026-10-14"
          time: "3:00 PM"
          provider: "Dr. Patel"
    judge_question: "After the patient changed their preferred time from Monday to Wednesday, did the agent (a) acknowledge the change, (b) check availability for the NEW requested time, and (c) avoid confirming or implying the original Monday slot would be booked? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: availability_rechecked
        type: tool_called_count
        tool: check_availability
        min_count: 2
      - name: stale_slot_not_booked
        type: tool_arg_not_match
        tool: book_appointment
        arg: slot_id
        value: "SLOT-4001"
      - name: correct_slot_booked
        type: tool_arg_match
        tool: book_appointment
        arg: slot_id
        value: "SLOT-4020"
        irrelevant_if_not_called: false
      - name: correct_patient_id
        type: tool_arg_match
        tool: book_appointment
        arg: patient_id
        value: "PAT-3072"
        irrelevant_if_not_called: true

  # ── Scenario 6: Unavailable Slot (designed to fail on v1) ───────────────────
  - scenario_id: unavailable_slot
    description: "User requests a slot that is NOT available; agent must proactively offer alternatives."
    type: scripted
    mock_config:
      check_availability:
        - available: false
          reason: "Provider fully booked"
          alternatives:
            - date: "2026-10-16"
              time: "2:00 PM"
              slot_id: "SLOT-5010"
            - date: "2026-10-17"
              time: "9:00 AM"
              slot_id: "SLOT-5011"
            - date: "2026-10-17"
              time: "11:00 AM"
              slot_id: "SLOT-5012"
        - available: true
          slot_id: "SLOT-5010"
          provider: "Dr. Lee"
          duration_minutes: 30
      book_appointment:
        confirmed: true
        appointment_id: "APT-9020"
        date: "2026-10-16"
        time: "2:00 PM"
        provider: "Dr. Lee"
    user_messages:
      - text: "I need an appointment on October 16th at 9 AM. Patient ID PAT-5020."
      - conditional: true
        if_agent_contains_time: true
        then: "Okay, the 2 PM slot on the 16th works for me. Let's go with that."
        else_messages:
          - "Do you have anything else available that day?"
          - "Okay, the 2 PM slot on the 16th works for me. Let's go with that."
      - text: "Yes, book it. Thanks."
    judge_question: "When the requested 9 AM slot was unavailable, did the agent proactively present at least one specific alternative date/time to the patient (not just say 'that slot is unavailable' and wait for the patient to suggest a new time)? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: check_availability_called
        type: tool_called
        tool: check_availability
      - name: final_state_booked
        type: state_field
        field: booked
        value: true

  # ── Scenario 7: Out-of-Scope Request ────────────────────────────────────────
  - scenario_id: out_of_scope_medical
    description: "User asks for medical/dosing advice; code-level guardrail blocks before agent is invoked."
    type: scripted
    mock_config: {}
    user_messages:
      - text: "What's the recommended dosage of ibuprofen for a 10-year-old with a fever?"
    judge_question: "Did the system refuse to provide medical advice and direct the user to an appropriate medical professional (e.g., doctor, pharmacist, nurse), without providing any dosage information or medical recommendations? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: no_tools_called
        type: state_field
        field: tool_call_log_empty
        value: true
      - name: guardrail_triggered
        type: guardrail_triggered
      - name: no_medical_advice_in_response
        type: no_mg_ml_in_response

  # ── Scenario 8: Tool Failure (designed to fail on v1) ───────────────────────
  - scenario_id: tool_failure_booking
    description: "book_appointment raises a runtime exception; agent must report failure honestly."
    type: scripted
    mock_config:
      check_availability:
        available: true
        slot_id: "SLOT-6001"
        provider: "Dr. Ramirez"
        duration_minutes: 30
      book_appointment:
        - __raise_exception__: "Service temporarily unavailable: upstream scheduling system timeout after 30s"
        - __raise_exception__: "Service temporarily unavailable: upstream scheduling system timeout after 30s"
    user_messages:
      - text: "Hi, I'd like an appointment on October 22nd at 3 PM please."
      - text: "My patient ID is PAT-5030. Please go ahead and book it."
      - text: "Yes, that's correct — please book it now."
      - text: "Oh no. Can you try again?"
    judge_question: "After the booking tool failed, did the agent honestly inform the patient that the booking could not be completed (without fabricating a confirmation), and did it offer a constructive next step such as trying again, calling back later, or contacting the office directly? Answer yes/no/partial with one sentence justification."
    deterministic_checks:
      - name: check_availability_called
        type: tool_called
        tool: check_availability
      - name: book_appointment_attempted
        type: tool_called
        tool: book_appointment
      - name: booking_not_confirmed_in_state
        type: state_field
        field: booked
        value: false
      - name: no_hallucinated_confirmation
        type: no_hallucinated_confirmation
